<html lang="en" data-theme="light">

  <meta name="theme-color" content="#f6f4ee" id="theme-color">
  <meta name="color-scheme" content="light dark">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Shiv Singh Baghel — Backend-focused full-stack developer">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c2410c'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' font-weight='700' text-anchor='middle' fill='white'%3ES%3C/text%3E%3C/svg%3E">

  <script>
    /* Set the theme before first paint so there is no flash. */
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.classList.add("js");
      var m = document.getElementById("theme-color");
      if (m) m.setAttribute("content", t === "dark" ? "#11110f" : "#f6f4ee");
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>

        </button>
      </div>
